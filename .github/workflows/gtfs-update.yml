name: Publicar GTFS Pozuelo
on:
  schedule:
    - cron: '15 4 * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Descargar GTFS y construir indices
        run: python scripts/refresh_gtfs.py
      - name: Verificar bundle local
        run: |
          test -s site/gtfs/latest.bin
          test -s site/gtfs/latest.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
